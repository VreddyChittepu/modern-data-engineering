[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "retail-streaming-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
test = ["pyspark==4.0.1", "pytest>=8,<9", "PyYAML>=6,<7", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["streaming: real local Structured Streaming", "databricks: requires deployed Databricks tables"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
[tool.ruff.lint.per-file-ignores]
"scripts/bootstrap.py" = ["F821"]
"scripts/acceptance.py" = ["F821"]
