resources:
  jobs:
    refresh:
      name: retail-refresh-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail.id}
            full_refresh: false
          max_retries: 2
          min_retry_interval_millis: 60000
    acceptance:
      name: retail-acceptance-${bundle.target}
      tasks:
        - task_key: assertions
          notebook_task:
            notebook_path: ../scripts/acceptance.py
            base_parameters:
              catalog: ${var.catalog}
